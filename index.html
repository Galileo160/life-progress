<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Life Progress</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --progress: 0%;
      --background: #050506;
      --text: #f5f5f7;
      --secondary: rgba(245, 245, 247, 0.5);
      --line: rgba(255, 255, 255, 0.1);
      --glow: rgba(255, 255, 255, 0.14);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;

      color: var(--text);
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255, 255, 255, 0.06),
          transparent 35%
        ),
        var(--background);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* Dezentes Hintergrundrauschen */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;

      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.8'/%3E%3C/svg%3E");
    }

    .ambient-glow {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      pointer-events: none;

      background: rgba(255, 255, 255, 0.05);
      filter: blur(110px);

      animation: breathe 6s ease-in-out infinite;
    }

    .container {
      position: relative;
      width: min(900px, 90vw);
      text-align: center;

      animation: appear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .eyebrow {
      margin-bottom: 24px;

      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.42em;
      text-transform: uppercase;

      color: var(--secondary);
    }

    .percentage-wrapper {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 10px;

      filter: drop-shadow(0 0 30px var(--glow));
    }

    #percentage {
      font-size: clamp(54px, 10vw, 128px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.065em;

      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .percent-symbol {
      margin-top: 9px;

      font-size: clamp(20px, 3vw, 38px);
      font-weight: 300;

      color: rgba(255, 255, 255, 0.42);
    }

    .progress-area {
      width: min(620px, 82vw);
      margin: 45px auto 0;
    }

    .progress-track {
      position: relative;
      width: 100%;
      height: 2px;
      overflow: visible;

      background: var(--line);
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--progress);

      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.4),
        rgba(255, 255, 255, 1)
      );

      box-shadow:
        0 0 10px rgba(255, 255, 255, 0.4),
        0 0 24px rgba(255, 255, 255, 0.16);

      transition: width 1s linear;
    }

    .progress-dot {
      position: absolute;
      top: 50%;
      left: var(--progress);

      width: 8px;
      height: 8px;
      border-radius: 50%;

      background: white;
      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.9),
        0 0 30px rgba(255, 255, 255, 0.45);

      transform: translate(-50%, -50%);
      transition: left 1s linear;

      animation: pulse 2.5s ease-in-out infinite;
    }

    .timeline-labels {
      display: flex;
      justify-content: space-between;

      margin-top: 12px;

      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.28);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      width: min(620px, 82vw);
      margin: 52px auto 0;
      padding-top: 28px;

      border-top: 1px solid var(--line);
    }

    .stat {
      position: relative;
      padding: 0 20px;
    }

    .stat:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 4px;
      right: 0;

      width: 1px;
      height: 42px;

      background: var(--line);
    }

    .stat-value {
      font-size: clamp(17px, 2.1vw, 23px);
      font-weight: 400;

      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      margin-top: 7px;

      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.19em;
      text-transform: uppercase;

      color: var(--secondary);
    }

    .footer {
      margin-top: 54px;

      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.2);
    }

    .footer span {
      color: rgba(255, 255, 255, 0.45);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
        filter: blur(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0.65;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.25);
        opacity: 1;
      }
    }

    @keyframes breathe {
      0%,
      100% {
        transform: scale(0.9);
        opacity: 0.6;
      }

      50% {
        transform: scale(1.12);
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
        gap: 26px;
      }

      .stat:not(:last-child)::after {
        display: none;
      }

      .percentage-wrapper {
        gap: 6px;
      }

      .progress-area {
        margin-top: 36px;
      }

      .stats {
        margin-top: 42px;
      }

      .footer {
        margin-top: 42px;
      }
    }
  </style>
</head>

<body>
  <div class="ambient-glow"></div>

  <main class="container">
    <div class="eyebrow">Lifetime consumed</div>

    <div class="percentage-wrapper">
      <div id="percentage">00.000000000</div>
      <div class="percent-symbol">%</div>
    </div>

    <section class="progress-area">
      <div class="progress-track">
        <div class="progress-fill"></div>
        <div class="progress-dot"></div>
      </div>

      <div class="timeline-labels">
        <span>05.03.2012</span>
        <span>05.03.2092</span>
      </div>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="stat-value" id="daysLived">0</div>
        <div class="stat-label">Tage gelebt</div>
      </div>

      <div class="stat">
        <div class="stat-value" id="daysRemaining">0</div>
        <div class="stat-label">Tage verbleibend</div>
      </div>

      <div class="stat">
        <div class="stat-value" id="currentAge">0</div>
        <div class="stat-label">Jahre alt</div>
      </div>
    </section>

    <div class="footer">
      Every second is part of the <span>whole</span>
    </div>
  </main>

  <script>
    /*
      Hier kannst du die Daten ändern.

      Die Uhrzeiten sind jeweils auf Mitternacht gesetzt.
      Dein angenommenes Lebensende ist dein 80. Geburtstag.
    */

    const birthDate = new Date(2012, 2, 5, 0, 0, 0, 0);
    const endDate = new Date(2092, 2, 5, 0, 0, 0, 0);

    const percentageElement = document.getElementById("percentage");
    const daysLivedElement = document.getElementById("daysLived");
    const daysRemainingElement = document.getElementById("daysRemaining");
    const currentAgeElement = document.getElementById("currentAge");

    const totalLifetime = endDate.getTime() - birthDate.getTime();
    const millisecondsPerDay = 1000 * 60 * 60 * 24;
    const averageMillisecondsPerYear =
      365.2425 * millisecondsPerDay;

    const numberFormatter = new Intl.NumberFormat("de-CH");

    function updateLifeProgress() {
      const now = new Date();

      const elapsedTime = now.getTime() - birthDate.getTime();
      const remainingTime = endDate.getTime() - now.getTime();

      const rawProgress = elapsedTime / totalLifetime;
      const boundedProgress = Math.min(Math.max(rawProgress, 0), 1);
      const percentage = boundedProgress * 100;

      /*
        10 Nachkommastellen sorgen dafür, dass die letzten
        Ziffern sichtbar und flüssig weiterlaufen.
      */
      percentageElement.textContent = percentage.toFixed(10);

      const daysLived = Math.floor(
        Math.max(elapsedTime, 0) / millisecondsPerDay
      );

      const daysRemaining = Math.ceil(
        Math.max(remainingTime, 0) / millisecondsPerDay
      );

      const exactAge =
        Math.max(elapsedTime, 0) / averageMillisecondsPerYear;

      daysLivedElement.textContent =
        numberFormatter.format(daysLived);

      daysRemainingElement.textContent =
        numberFormatter.format(daysRemaining);

      currentAgeElement.textContent = exactAge.toFixed(8);

      document.documentElement.style.setProperty(
        "--progress",
        `${percentage}%`
      );

      requestAnimationFrame(updateLifeProgress);
    }

    updateLifeProgress();
  </script>
</body>
</html>
